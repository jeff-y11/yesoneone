spring.config.import=optional:file:./application-secrets.properties

geodevai.jwt.expiration-time=1440
geodevai.app.frontend-url=http://localhost:8080
geodevai.app.cors.allowed-origins=http://localhost:5173

spring.data.rest.base-path=/data

spring.jackson.default-property-inclusion=non_null
spring.jackson.parser.allow-non-numeric-numbers=true
spring.jackson.date-format=dd-MM-yyyy HH:mm
spring.jackson.time-zone=UTC

spring.datasource.url=jdbc:postgresql://localhost:5432/geodevai
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:geodevai_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

logging.file.name=logs/geodevai.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=4
logging.logback.rollingpolicy.total-size-cap=50MB

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,https://www.googleapis.com/auth/calendar.readonly,https://www.googleapis.com/auth/chat.spaces.readonly,https://www.googleapis.com/auth/chat.messages.readonly
